<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,Roboto,sans-serif;text-align:center}
.box{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px}
.mk{width:64px;height:64px;display:grid;place-items:center;border:1px solid #272727;border-radius:16px;background:linear-gradient(to right bottom,#3f3f46,#18181b);font-size:24px}
h1{font-size:24px;letter-spacing:-.6px}
p{color:#9f9fa9;line-height:1.5}
button{height:48px;padding:0 24px;border:2px solid #fff;border-radius:9999px;background:#fff;color:#0a0a0a;font-size:14px;font-weight:600}
button:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="box">
<div class="mk">&lt;/&gt;</div>
<h1>Lagi offline</h1>
<p>Nggak bisa nyambung ke server. Cek koneksi internetmu, terus coba lagi.</p>
<button onclick="location.href='app://retry'">Coba lagi</button>
</div>
</body>
</html>
