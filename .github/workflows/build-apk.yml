name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      site_url:
        description: URL website (tanpa slash di akhir)
        required: false
        default: https://codeku.izzxd.my.id

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Pasang platform dan build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Siapkan keystore (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SITE_URL_INPUT: ${{ github.event.inputs.site_url }}
        run: |
          EXTRA=""
          if [ -n "$SITE_URL_INPUT" ]; then EXTRA="-PSITE_URL=$SITE_URL_INPUT"; fi
          gradle assembleRelease $EXTRA --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: izz-code-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
